name: Integration Tests

on:
  push:
    branches: [ "main"]
  pull_request:
    branches: [ "main"]

jobs:
  build:

    runs-on: ubuntu-latest

    steps:
    - uses: actions/checkout@v4
    - name: configure
      run:  |
        sudo apt update
        sudo apt install libhdf5-dev
    - name: cache-deps
      uses: actions/cache@v4
      with:
        path: build/_deps
        key: ${{ runner.os }}-deps-${{ hashFiles('CMakeLists.txt') }}
    - name: make
      run: |
        # LBM_BUILD_UNIT_TESTS=OFF: unit_tests needs a Debug build for
        # idx()'s ASSERT_DEATH checks to hold (see unit-tests.yml, which
        # covers it as a separate required check) — building it here under
        # Release would fail that check. Skipping registration entirely
        # also means new integration test executables are picked up
        # automatically, with nothing to enumerate by hand here.
        cmake -B build -DLBM_FORCE_CPU=ON -DCMAKE_BUILD_TYPE=Release -DLBM_BUILD_UNIT_TESTS=OFF
        cmake --build build
    - name: test
      run: |
        cd build
        ctest --output-on-failure --timeout 300
